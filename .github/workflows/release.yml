name: Release

# Push a tag like v1.0.0 to publish a GitHub release with the universal app attached.
# The website's download button links to releases/latest/download/PST-Viewer.zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test PSTKit
        run: swift test
      - name: Build app bundle (universal)
        run: ./scripts/build-app.sh universal
      - name: Zip app
        run: cd dist && ditto -c -k --keepParent "PST Viewer.app" PST-Viewer.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/PST-Viewer.zip --title "PST Viewer $GITHUB_REF_NAME" --generate-notes
