name: Build

on:
  push:
    branches: [main]
    # A version tag (v1.2.0) also publishes a GitHub release, which the app's updater installs.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-26
    permissions:
      contents: write  # for publishing releases
    env:
      # Signing and notarization run when all their secrets are set (see "Notarized builds" in the
      # README) and never for pull requests, which don't need a distributable app.
      NOTARIZE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, so build-app.sh can stamp the version
      - name: Release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The updater only installs releases signed with the same Developer ID as the running app.
          if [[ "$NOTARIZE" != "true" ]]; then
            echo "::error::Releases must be signed and notarized; set the secrets from \"Notarized builds\" in the README."
            exit 1
          fi
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Swift version
        run: swift --version
      - name: Test PSTKit
        run: swift test
      - name: Build app bundle (native, as a user would)
        run: /bin/bash ./scripts/build-app.sh
      - name: Import Developer ID certificate
        if: env.NOTARIZE == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -nE 's/.*"(Developer ID Application: .*)"/\1/p' | head -1)"
          [[ -n "$IDENTITY" ]] || { echo "No Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build app bundle (universal)
        run: ./scripts/build-app.sh universal
      - name: Notarize
        if: env.NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/notarize.sh
      - name: Smoke test pstdump
        run: |
          swift run -c release pstdump Tests/PSTKitTests/Fixtures/tika-ansi-high.pst --messages
          swift run -c release pstdump Tests/PSTKitTests/Fixtures/netscape --messages
          swift run -c release pstdump Tests/PSTKitTests/Fixtures/tika-testPST.pst Tests/PSTKitTests/Fixtures/netscape --mbox "$RUNNER_TEMP/export.mbox" --search "example"
      - name: Screenshots
        timeout-minutes: 4
        continue-on-error: true
        run: |
          APP="dist/PST Viewer.app/Contents/MacOS/PSTViewer"
          "$APP" --snapshot "$PWD/dist/screenshot-welcome.png" < /dev/null
          # Same route as a Finder double-click (smoke test; not used in the README):
          open -W -a "$PWD/dist/PST Viewer.app" "$PWD/Tests/PSTKitTests/Fixtures/tika-testPST.pst" --args --demo --snapshot "$PWD/dist/screenshot-finder-open.png"
          "$APP" "$PWD/Tests/PSTKitTests/Fixtures/tika-testPST.pst" --demo --snapshot "$PWD/dist/screenshot-viewer.png" < /dev/null
          "$APP" "$PWD/Tests/PSTKitTests/Fixtures/dist-list-ansi.pst" --demo --snapshot "$PWD/dist/screenshot-ansi.png" < /dev/null
          "$APP" --settings --snapshot "$PWD/dist/screenshot-settings.png" < /dev/null
      - name: Zip app
        run: cd dist && ditto -c -k --keepParent "PST Viewer.app" PST-Viewer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PST-Viewer-macOS
          path: dist/PST-Viewer.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/PST-Viewer.zip --clobber
          else
            # Tags with a suffix (v1.2.0-beta.1) become pre-releases, which the updater ignores.
            FLAGS=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then FLAGS=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" dist/PST-Viewer.zip --verify-tag --generate-notes \
              --title "PST Viewer ${GITHUB_REF_NAME#v}" ${FLAGS[@]+"${FLAGS[@]}"}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: dist/screenshot-*.png
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test PSTKit
        run: swift test
