name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test PSTKit
        run: swift test
      - name: Build app bundle (universal)
        run: ./scripts/build-app.sh universal
      - name: Smoke test pstdump
        run: swift run -c release pstdump Tests/PSTKitTests/Fixtures/tika-ansi-high.pst --messages
      - name: Screenshot
        timeout-minutes: 3
        continue-on-error: true
        run: |
          "dist/PST Viewer.app/Contents/MacOS/PSTViewer" "$PWD/Tests/PSTKitTests/Fixtures/tika-testPST.pst" --demo > /tmp/app.log 2>&1 < /dev/null &
          APP_PID=$!
          sleep 15
          screencapture -x dist/screenshot.png < /dev/null || true
          kill $APP_PID || true
          cat /tmp/app.log
      - name: Zip app
        run: cd dist && ditto -c -k --keepParent "PST Viewer.app" PST-Viewer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PST-Viewer-macOS
          path: dist/PST-Viewer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: dist/screenshot.png
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test PSTKit
        run: swift test
